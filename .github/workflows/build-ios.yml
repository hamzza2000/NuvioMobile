name: Build iOS IPA

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix submodules and clone MPVKit manually
        run: |
          git config --file .gitmodules --remove-section submodule.libass-android 2>/dev/null || true
          git config --file .gitmodules --remove-section submodule.MPVKit 2>/dev/null || true
          git config --file .gitmodules --remove-section "submodule.iosApp/MPVKit" 2>/dev/null || true
          git config --remove-section submodule.libass-android 2>/dev/null || true
          git config --remove-section submodule.MPVKit 2>/dev/null || true
          git config --remove-section "submodule.iosApp/MPVKit" 2>/dev/null || true
          git clone https://github.com/mpvkit/MPVKit.git MPVKit
          git submodule sync 2>/dev/null || true
          git submodule update --init --recursive 2>/dev/null || true

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build Kotlin/Native iOS framework
        run: ./gradlew :composeApp:linkReleaseFrameworkIosArm64

      - name: Resolve Swift Package dependencies
        run: |
          cd iosApp
          xcodebuild -resolvePackageDependencies \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -clonedSourcePackagesDirPath ../spm-packages

      - name: Build and archive
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/iosApp.xcarchive \
            -clonedSourcePackagesDirPath ../spm-packages \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA from archive
        run: |
          cd iosApp
          mkdir -p build/ipa/Payload
          cp -r build/iosApp.xcarchive/Products/Applications/Nuvio.app build/ipa/Payload/
          cd build/ipa
          zip -r Nuvio.ipa Payload
          echo "IPA created successfully"
          ls -lh Nuvio.ipa

      - name: Create Release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS Build ${{ github.run_number }}
          files: iosApp/build/ipa/Nuvio.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
