name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fix broken submodules
        run: |
          git config --file .gitmodules --get-regexp path | while read key path; do
            url_key=$(echo $key | sed 's/\.path$/.url/')
            url=$(git config --file .gitmodules --get $url_key 2>/dev/null || echo "")
            if [ -z "$url" ]; then
              echo "Removing broken submodule: $path"
              git config --file .gitmodules --remove-section "submodule.$path" 2>/dev/null || true
            fi
          done
          git submodule sync 2>/dev/null || true
          git submodule update --init --recursive 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: List available Gradle tasks
        run: ./gradlew :composeApp:tasks --group=build | grep -i ios || true

      - name: Build Kotlin/Native iOS framework
        run: |
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 || \
          ./gradlew :composeApp:assembleXCFramework || \
          ./gradlew :composeApp:linkReleaseFrameworkIosSimulatorArm64 || \
          echo "Trying all known iOS framework tasks..."
          ./gradlew :composeApp:tasks | grep -i "ios\|xcframework\|framework" || true

      - name: Resolve Swift Package dependencies
        run: |
          cd iosApp
          xcodebuild -resolvePackageDependencies \
            -project iosApp.xcodeproj \
            -scheme iosApp

      - name: Build unsigned IPA
        run: |
          cd iosApp
          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/iosApp.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          xcodebuild \
            -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist exportOptions.plist

      - name: Create Release and upload IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS Build ${{ github.run_number }}
          files: iosApp/build/ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
